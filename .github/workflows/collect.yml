# Collects the YEGO GBFS feed in the cloud, so no computer has to stay on.
# Every hour: 55 minutes of snapshots (one every 2 minutes, Nice and Barcelona), merged into one
# Parquet file per city, committed to the `data` branch. Stop it from the Actions tab
# (Collect YEGO feed > ... > Disable workflow).

name: Collect YEGO feed

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          ref: data
          path: store

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install requests pyarrow

      - name: Collect for 55 minutes
        run: python src/collector.py --loop --minutes 55 --merge --out-dir store/data

      - name: Commit the hour to the data branch
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
