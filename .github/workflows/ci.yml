name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: dbt build (models and data tests) on the versioned compact data
        working-directory: transform
        run: |
          dbt build --profiles-dir . --vars '{source: compact}'

      - name: Export the star schema used by Power BI and the API
        run: python src/export_bi.py

      - name: API tests
        run: pytest -q
