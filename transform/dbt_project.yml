name: yego_ops
version: "1.0.0"
config-version: 2
profile: yego_ops

model-paths: ["models"]
test-paths: ["tests"]

vars:
  # Source du staging : "raw" (collecte locale complete) ou "compact" (data/compact, versionne, utilise par la CI)
  source: raw
  compact_glob: "../data/compact/*.parquet"
  zone_names_path: "../data/static/zone_names.json"
  # Snapshots bruts du collecteur : data/raw/city=<ville>/date=<jour>/fbs_<epoch>.parquet
  raw_glob: "../data/raw/*/*/*.parquet"
  # Identifiants stables reconstruits par src/track_vehicles.py
  tracks_glob: "../data/tracks/*/tracks.parquet"
  # Seuils metier
  low_battery_pct: 20
  # Seuil observe dans les donnees : aucun vehicule actif sous 15 % (YEGO les desactive).
  disable_battery_pct: 15
  idle_hours_threshold: 6
  swap_min_gain: 20
  swap_max_move_m: 5
  # Cadence du collecteur (secondes) et tolerance avant de compter un trou
  snapshot_interval_s: 120
  gap_tolerance_s: 360

models:
  yego_ops:
    staging:
      +materialized: view
    marts:
      +materialized: table
